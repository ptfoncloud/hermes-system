[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; Build flags
build_flags =
    -O2
    -DSERIAL_USB
    -DLAYOUT_US_ENGLISH
    -std=gnu++17
    -Wall
    -Wextra

; No external sensor libraries — all drivers are hand-rolled from datasheets
; lib_deps is intentionally empty

monitor_speed = 115200
upload_protocol = teensy-cli
